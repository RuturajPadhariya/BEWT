<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        document.addEventListener('click', (e) => {
            if (e.button === 0) alert('Left clicked');
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            alert('Right clicked');
        });
    </script>

</body>
</html>
